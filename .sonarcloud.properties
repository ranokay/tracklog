# SonarCloud automatic analysis configuration.
#
# Automatic analysis does not honor `sonar.issue.ignore.multicriteria`, so
# rule-scoped suppression is unavailable. These whole-file exclusions cover
# only declarations whose findings are false positives for this protocol:
#
# - LastFMSignature.swift: Last.fm requires MD5 for request signatures. It is a
#   protocol MAC over a public shared secret, not password storage.
# - LastFMWebEndpoint.swift: the URL path is named "auth"; it is an endpoint,
#   not a hard-coded credential.
# - Tests/: fixture URLs and intentionally empty log closures are test-shape
#   noise, covered by the engine suite instead.
sonar.exclusions=tracklog/Sources/TracklogCore/LastFMSignature.swift,tracklog/Sources/TracklogCore/LastFMWebEndpoint.swift,Tests/**
sonar.test.exclusions=Tests/**
