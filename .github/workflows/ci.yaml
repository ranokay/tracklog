name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` re-runs test and lint too. Accept the extra run: a skipped run
    # on the same SHA supersedes the earlier check once these are required.
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Run script tests
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Run engine tests
        run: swift test --package-path Tests

  # The test job compiles only the engine targets. This compiles the SwiftUI
  # droplet target and the harness too, so a break there fails before the
  # local gate runs.
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile the droplet and harness
        run: swift build --package-path tracklog --product TracklogHarness

  lint:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
      - name: Run dev checks
        run: hk check --all

  pr-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_body.py
