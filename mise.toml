[tools]
hk = "2.8.1"
jactionlint = "2.3.0"
shellcheck = "0.11.0"
swiftlint = "0.65.1"
swiftformat = "0.64.1"

[tasks.test]
description = "Run the engine test suite"
run = "swift test --package-path Tests"

[tasks.lint]
description = "Run SwiftFormat, SwiftLint and jactionlint"
run = "hk check --all"

[tasks.format]
description = "Apply available formatting and lint fixes"
run = "hk fix --all"

[tasks.hooks]
description = "Install the hk Git hooks"
run = "hk install"

[tasks.gate]
description = "Run the full pre-submission gate"
run = "scripts/gate.sh"
