[tools]
hk = "2.8.1"
jactionlint = "2.3.0"
shellcheck = "0.11.0"
swiftlint = "0.65.1"
swiftformat = "0.64.1"

[tasks.test]
description = "Run the engine test suite under the process-tree timeout"
run = "python3 scripts/run_with_timeout.py swift test --package-path Tests"

[tasks.lint]
description = "Run SwiftFormat, SwiftLint, jactionlint and shellcheck"
run = "hk check --all"

[tasks.format]
description = "Apply available formatting and lint fixes"
run = "hk fix --all"

[tasks.hooks]
description = "Install the hk Git hooks"
run = "hk install"

[tasks.verify]
description = "Run the inner-loop checks without the surface shot matrix"
run = "scripts/verify.sh"

[tasks.gate]
description = "Run the full pre-submission gate"
run = "scripts/gate.sh"
